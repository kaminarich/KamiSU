name: Build KernelSU Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20251104'
        type: string
      ksu_expected_size:
        description: 'Manager APK certificate size (decimal) to embed in kamisu_sign.h'
        required: false
        default: ''
        type: string
      ksu_expected_hash:
        description: 'Manager APK certificate SHA-256 hash to embed in kamisu_sign.h'
        required: false
        default: ''
        type: string
      artifact_name:
        description: 'Override artifact upload name (default: <kmi>-lkm)'
        required: false
        default: ''
        type: string

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Build kernelsu.ko
      env:
        KSU_EXPECTED_SIZE: ${{ inputs.ksu_expected_size }}
        KSU_EXPECTED_HASH: ${{ inputs.ksu_expected_hash }}
      run: |
        git config --global --add safe.directory /__w/KamiSU/KamiSU

        # Update kamisu_sign.h with the freshly-built APK certificate hash
        # when the caller supplies ksu_expected_size + ksu_expected_hash.
        if [ -n "$KSU_EXPECTED_SIZE" ] && [ -n "$KSU_EXPECTED_HASH" ]; then
          echo "=== Updating kamisu_sign.h ==="
          python3 scripts/update_kamisu_sign.py \
            kernel/kamisu_sign.h \
            "$KSU_EXPECTED_SIZE" \
            "$KSU_EXPECTED_HASH"
          echo "--- Updated kamisu_sign.h ---"
          cat kernel/kamisu_sign.h
        fi

        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ inputs.kmi }} ==="
        CONFIG_KSU=m CONFIG_KSU_MANUAL_SU=y CC=clang make
        
        echo "=== Build completed ==="
        # Create output directory in GitHub workspace
        mkdir -p /github/workspace/out
        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "/github/workspace/out/$OUTPUT_NAME"
        
        echo "Copied to: /github/workspace/out/$OUTPUT_NAME"
        ls -la "/github/workspace/out/$OUTPUT_NAME"
        echo "Size: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "/github/workspace/out/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"
        
    - name: Upload kernelsu.ko artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact_name || format('{0}-lkm', inputs.kmi) }}
        path: /github/workspace/out/${{ inputs.kmi }}_kernelsu.ko
